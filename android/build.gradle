group 'com.handbreak.handbreak'
version '1.0'

buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.2.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.handbreak.handbreak'
    compileSdk 34

    defaultConfig {
        minSdk 21
        // 16KB page size ready (Android 15+)
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    lintOptions { disable 'InvalidPackage' }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Flutter embedding is normally provided by the host app; make it available
    // for standalone plugin unit tests (JVM) when the Flutter SDK is present.
    def flutterRoot = System.getenv('FLUTTER_ROOT') ?: "${System.getProperty('user.home')}/development/flutter"
    def flutterJar = file("${flutterRoot}/bin/cache/artifacts/engine/android-arm64/flutter.jar")
    if (flutterJar.exists()) {
        compileOnly files(flutterJar)
    }

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version'
}
