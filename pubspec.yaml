name: flutter_handbreak
description: >
  Lightweight Flutter video & image compression inspired by HandBrake — quality-first,
  hardware-accelerated, any-format fallback. Easy one-liner API with presets & progress.
version: 1.0.3
homepage: https://github.com/rahulshahDEV/flutter_handbreak
repository: https://github.com/rahulshahDEV/flutter_handbreak
issue_tracker: https://github.com/rahulshahDEV/flutter_handbreak/issues
funding:
  - https://github.com/sponsors/rahulshahDEV

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  meta: ^1.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.handbreak.handbreak
        pluginClass: HandbreakPlugin
      ios:
        pluginClass: HandbreakPlugin

topics:
  - video
  - image
  - compression
  - media